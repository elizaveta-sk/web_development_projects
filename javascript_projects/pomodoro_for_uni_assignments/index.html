<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Folders</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="Study folder prototype">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <div class="status-icons">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <header class="topbar">
          <button class="icon-button hidden" id="backButton" aria-label="Go back">
            <span class="chevron"></span>
          </button>
          <div>
            <p class="eyebrow" id="contextLabel">Subjects</p>
            <h1 id="screenTitle">Study</h1>
          </div>
        </header>

        <section class="summary" id="summary"></section>

        <section class="content" id="content" aria-live="polite"></section>

        <div class="bottom-action">
          <button class="primary-button" id="addButton">
            <span class="plus" aria-hidden="true"></span>
            <span id="addButtonLabel">Add subject</span>
          </button>
        </div>
      </section>
    </main>

    <dialog class="sheet" id="entryDialog">
      <form method="dialog" id="entryForm">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header">
          <div>
            <p class="eyebrow" id="dialogContext">New</p>
            <h2 id="dialogTitle">Add subject</h2>
          </div>
          <button class="ghost-button" value="cancel" type="button" id="cancelDialog">Cancel</button>
        </header>

        <div class="fields" id="dialogFields"></div>

        <button class="primary-button full" type="submit" id="saveDialog">Save</button>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
